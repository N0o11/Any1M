<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Great+Vibes&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <style>
        
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    place-items: center;
    background: #111;
    transition: opacity 0.6s ease;   /* ตอนจางหาย */
  }
  body.fade-out { opacity: 0; }
  img { width: 300px; cursor: pointer; }
</style>
</head>
<body class="p">

<div id="fade"></div>

    <a href="Main.html" id="link" class="wrap">
    <p class="c">Open here</p>
    <img src="img/ดีไซน์ที่ยังไม่ได้ตั้งชื่อ.png" alt="ซองจดหมาย">
  </a>

  <div id="fade"></div>
  <div class="hearts" id="hearts"></div>

<script>
  const box = document.getElementById('hearts');
  for (let i = 0; i < 14; i++) {
    const h = document.createElement('span');
    h.textContent = Math.random() > 0.5 ? '♡' : '♥';
    h.style.left = Math.random() * 100 + '%';
    h.style.fontSize = (12 + Math.random() * 18) + 'px';
    h.style.animationDuration = (9 + Math.random() * 8) + 's';
    h.style.animationDelay = (Math.random() * 4) + 's';
    box.appendChild(h);
  }
</script>

  <script>
    document.getElementById('link').addEventListener('click', e => {
      e.preventDefault();
      const url = e.currentTarget.href;
      document.getElementById('fade').classList.add('show');
      setTimeout(() => location.href = url, 800);
    });
  </script>
</script>
</body>
</html>
